name: Build & Test

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Check formatting
        run: npm run format -- --check
        continue-on-error: true

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          size=$(stat -f%z dist/assets/index-*.js 2>/dev/null || stat -c%s dist/assets/index-*.js)
          gzip_size=$(gzip -c dist/assets/index-*.js | wc -c)
          echo "Bundle size: $(numfmt --to=iec-i --suffix=B $size 2>/dev/null || echo '$size bytes')"
          echo "Gzipped size: $(numfmt --to=iec-i --suffix=B $gzip_size 2>/dev/null || echo '$gzip_size bytes')"
          # Fail if gzip exceeds 50KB (leave room for growth)
          if [ $gzip_size -gt 52428800 ]; then
            echo "Bundle size exceeded 50KB gzipped!"
            exit 1
          fi

      - name: Run tests
        run: npm run test
        continue-on-error: true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
