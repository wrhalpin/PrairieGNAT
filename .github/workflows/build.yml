name: Build & Test

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Check formatting
        run: npm run format -- --check
        continue-on-error: true

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          gzip_size=$(cat dist/assets/*.js | gzip | wc -c)
          echo "Total JS gzipped: ${gzip_size} bytes"
          # Project budget is 200KB gzip (see CLAUDE.md)
          if [ "$gzip_size" -gt 204800 ]; then
            echo "Bundle size exceeded 200KB gzipped!"
            exit 1
          fi

      - name: Run tests
        run: npm run test

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
